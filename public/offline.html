<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071426" />
    <title>You are offline · CrewLink</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100dvh; margin: 0; place-items: center; overflow: hidden; background: radial-gradient(circle at 70% 0%, #235584, transparent 42%), #071426; color: #ecf4ff; }
      main { width: min(calc(100% - 40px), 430px); padding: 34px 28px; border: 1px solid rgba(157, 201, 242, .25); border-radius: 24px; background: rgba(7, 20, 38, .82); box-shadow: 0 20px 60px rgba(0, 0, 0, .3); text-align: center; }
      .mark { display: flex; justify-content: center; gap: 5px; margin: 0 auto 28px; }
      .mark i { display: block; width: 6px; border-radius: 999px; background: #50a9ff; }
      .mark i:nth-child(1) { height: 18px; margin-top: 10px; }
      .mark i:nth-child(2) { height: 38px; }
      .mark i:nth-child(3) { height: 25px; margin-top: 6px; }
      p { margin: 0; color: #9eb1c8; line-height: 1.6; }
      h1 { margin: 0 0 13px; font-size: clamp(2rem, 10vw, 3rem); letter-spacing: -.07em; }
      button { width: 100%; min-height: 50px; margin-top: 28px; border: 0; border-radius: 13px; background: #50a9ff; color: #041426; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>YOU ARE OFFLINE</h1>
      <p>Reconnect to the internet, then try CrewLink again to join your crew room.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
